[project]
name = "django-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<6"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-django>=4.9", "ruff>=0.9"]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
