name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check
        run: ./scripts/check
      - name: Bootstrap tests
        run: sh -x ./tests/bootstrap.sh
      - name: Profile tests
        run: sh -x ./tests/profiles.sh
      - name: Security
        run: ./scripts/security
